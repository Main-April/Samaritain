<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Samaritan</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
<style>
  @font-face {
    font-family: "magdacleanmono";
    src: url("magdacleanmono-regular-webfont.otf") format("opentype");
  }
  body {
    color: #FFF;
    background-color: #000;
    height: 100%;
    width: 100%;
    position: fixed;
    margin: 0;
    padding: 0;
    text-align: center;
    font-family: "magdacleanmono", "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  p {
    font-family: "magdacleanmono";
    font-size: 2em;
    text-transform: uppercase;
    display: block !important;
  }
  #text {
    font-weight: bold;
  }
  #text.word-in {
    animation: textIn 0.15s ease;
  }
  #text.word-out {
    animation: textOut 0.15s ease forwards;
  }
  @keyframes textIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes textOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
  #main {
    position: absolute;
    display: block;
    width: 100%;
    bottom: 50%;
  }
  #main hr {
    width: 30px; /* default initial size */
    border-top: 2px solid #FFF;
    border-bottom: none;
  }
  #main p, #main hr {
    margin-top: 0;
    margin-bottom: 0;
  }
  #main p.hidden {
    color: #000;
  }
  #marker {
    position: absolute;
    display: block;
    width: 100%;
    top: 50%;
    vertical-align: top;
  }
  #triangle {
    color: #F00;
    font-size: 2em;
    font-family: "magdacleanmono";
    display: inline-block;
  }
  body.listening #triangle { animation: pulse 1s ease-in-out infinite; }
  body.thinking #triangle  { animation: blink 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: 0.6; }
    50%  { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1);    opacity: 0.6; }
  }
  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  #settings {
    width: 30px;
    height: 30px;
    font-size: 10px;
    position: absolute;
    bottom: 0px;
    right: 0px;
    color: #444;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
  }

  #hint {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    font-size: 0.6em;
    letter-spacing: 0.3em;
    color: #444;
    pointer-events: none;
  }

  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: transparent;
    z-index: 999;
    pointer-events: none;
    box-sizing: border-box;
  }
  #status.show { display: flex; }
  #status .label {
    background: #000;
    color: #FFF;
    font-family: "magdacleanmono", "Courier New", monospace;
    font-size: 1.6em;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 20px 40px;
    max-width: 82vw;
    border: 2px solid #FFF;
  }
  #status.show .label {
    animation: labelIn 0.5s ease;
  }
  #status.hide .label {
    animation: labelOut 0.5s ease forwards;
  }
  @keyframes labelIn {
    0%   { transform: scale(1.2);  opacity: 0; }
    45%  { transform: scale(0.55); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  @keyframes labelOut {
    0%   { transform: scale(1);    opacity: 1; }
    45%  { transform: scale(0.55); opacity: 1; }
    100% { transform: scale(1.2);  opacity: 0; }
  }

  #panel {
    position: fixed;
    right: 10px;
    bottom: 34px;
    display: none;
    z-index: 10;
    max-width: 300px;
    padding: 12px 14px;
    background: #111;
    border: 1px solid #333;
    text-align: left;
  }
  #panel.open { display: block; }
  #panel h1 {
    margin: 0 0 8px;
    color: #888;
    font-size: 0.65em;
    font-weight: normal;
    letter-spacing: 0.25em;
  }
  #panel p {
    margin: 0 0 8px;
    color: #FFF;
    font-size: 0.7em;
    word-break: break-all;
  }
  #panel button {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 6px 0;
    background: none;
    color: #FFF;
    border: 1px solid #444;
    font-family: inherit;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  #panel button:hover { background: #222; }

  /* ---------- LOADER / BOOT ---------- */
  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #050505;
    z-index: 1000;
    overflow: hidden;
  }
  #loader::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .loader-pane {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    background: #000;
    z-index: 3;
    transition: width 1s cubic-bezier(0.77, 0, 0.18, 1);
  }
  #loader-left  { left: 0; border-right: 2px solid #FFF; }
  #loader-right { right: 0; border-left: 2px solid #FFF; }
  #loader.open  .loader-pane { width: 13%; }
  #loader.done  .loader-pane {
    width: 0;
    border-color: transparent;
    transition: width 1s cubic-bezier(0.77, 0, 0.18, 1), border-color 0.3s ease 0.5s;
  }

  #loader-center {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
  }
  #boot-log {
    position: absolute;
    top: 24px;
    left: 16%;
    font-size: 0.55em;
    line-height: 1.6;
    color: #777;
    text-align: left;
    max-width: 60%;
    max-height: 45%;
    overflow: hidden;
    white-space: nowrap;
    opacity: 0;
  }
  #loader.open #boot-log {
    animation: logFadeIn 0.6s ease 0.2s forwards;
  }
  @keyframes logFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #loading-pane-container {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    text-align: center;
    opacity: 0;
  }
  #loader.open #loading-pane-container {
    animation: pulseIn 0.7s ease 0.35s forwards;
  }
  @keyframes pulseIn {
    0%   { opacity: 0; }
    30%  { opacity: 0.85; }
    45%  { opacity: 0.05; }
    100% { opacity: 1; }
  }
  .invert {
    display: inline-block;
    background: #FFF;
    color: #000;
    padding: 3px 8px;
    letter-spacing: 0.2em;
    font-size: 0.6em;
  }
  #loading-name {
    font-size: 1.1em;
    margin: 12px 0 10px;
    color: #FFF;
    min-height: 1.2em;
  }
  #loading-bar-container {
    width: 70%;
    max-width: 460px;
    margin: 0 auto;
    border: 2px solid #FFF;
    padding: 2px;
    height: 18px;
    box-sizing: border-box;
  }
  #loading-bar {
    position: relative;
    background: #FFF;
    height: 100%;
    width: 0;
    overflow: hidden;
    transition: width 0.25s ease-out;
  }
  #loading-bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.85), transparent);
    animation: barShine 1.4s linear infinite;
  }
  @keyframes barShine {
    from { left: -50%; }
    to   { left: 100%; }
  }
  #loading-connected {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    text-align: center;
    opacity: 0;
  }
  #loading-connected.show {
    animation: connectPulse 2.4s ease forwards;
  }
  #loading-connected.error .invert { background: #F00; }
  @keyframes connectPulse {
    0%   { opacity: 0; }
    12%  { opacity: 0.85; }
    22%  { opacity: 0.05; }
    32%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .cursor-blink { animation: loaderBlink 1s steps(1) infinite; }
  @keyframes loaderBlink { 50% { opacity: 0; } }

  @media(min-width: 900px){
    #main p.hidden {
      color: #fff;
    }
    body {
      color: #000 !important;
      background-color: #fff;
    }
    #main hr {
      border-top: 2px solid #000;
    }
    body, html {
      background-color: rgba(0, 0, 0, 0.56);
      background: -moz-radial-gradient(center, ellipse cover, rgba(255,255,255,0.56) 0%, rgba(127,127,127,1) 100%);
      background: -webkit-gradient(radial, center center, 0px, center center, 100%, color-stop(0%,rgba(255,255,255,0.56)), color-stop(100%,rgba(127,127,127,1)));
      background: -webkit-radial-gradient(center, ellipse cover, rgba(255,255,255,0.56) 0%,rgba(127,127,127,1) 100%);
      background: -o-radial-gradient(center, ellipse cover, rgba(255,255,255,0.56) 0%,rgba(127,127,127,1) 100%);
      background: -ms-radial-gradient(center, ellipse cover, rgba(255,255,255,0.56) 0%,rgba(127,127,127,1) 100%);
      background: radial-gradient(center, ellipse cover, rgba(255,255,255,0.56) 0%,rgba(127,127,127,1) 100%);
    }
    #hint { color: #666; }
    #panel {
      background: rgba(255,255,255,0.92);
      border-color: #999;
    }
    #panel h1 { color: #666; }
    #panel p { color: #000; }
    #panel button { color: #000; border-color: #888; }
    #panel button:hover { background: #EEE; }
  }
</style>
</head>
<body>
  <div id="main">
    <p id="text" class="hidden">&nbsp;</p>
    <hr id="bar">
  </div>
  <div id="marker">
    <span id="triangle">&#9650;</span>
  </div>
  <div id="hint">touche ou parle</div>
  <div id="settings" title="Réglages">&#9881;</div>
  <div id="panel">
    <h1>Samaritan // Réglages</h1>
    <p id="modelName"></p>
    <button id="reloadBtn">Recharger le modèle</button>
  </div>
  <div id="status"><div class="label"></div></div>

  <div id="loader">
    <div id="loader-center">
      <div id="boot-log"></div>
      <div id="loading-pane-container">
        <div><span class="invert">loading <span class="cursor-blink">_</span></span></div>
        <div id="loading-name">initialisation…</div>
        <div id="loading-bar-container"><div id="loading-bar"></div></div>
      </div>
      <div id="loading-connected"><span id="loading-connected-text" class="invert">connection established</span></div>
    </div>
    <div id="loader-left" class="loader-pane"></div>
    <div id="loader-right" class="loader-pane"></div>
  </div>

<script type="module">
import { env, pipeline, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/dist/transformers.min.js";

(() => {
  "use strict";

  // ---------- CONFIG ----------
  env.allowLocalModels = false;
  const MODEL_ID     = "onnx-community/Qwen2.5-0.5B-Instruct-ONNX-GQA";
  const DTYPE        = "q4";
  const LANG         = "fr-FR";
  const MAX_NEW_TOKENS = 90;
  const WORD_DELAY_MS = 70;
  const FADE_MS       = 120;

  // ---------- DOM ----------
  const textEl      = document.getElementById("text");
  const barEl       = document.getElementById("bar");
  const bodyEl      = document.body;
  const hintEl      = document.getElementById("hint");
  const panelEl     = document.getElementById("panel");
  const modelNameEl = document.getElementById("modelName");
  const mainEl      = document.getElementById("main");
  const statusEl    = document.getElementById("status");
  const statusLabelEl = document.querySelector("#status .label");

  let recognition = null;
  let isBusy = false;
  let generator = null;

  modelNameEl.textContent = MODEL_ID;

  // ---------- AFFICHAGE ----------
  function measureTextWidth(text) {
    const cs = getComputedStyle(textEl);
    const span = document.createElement("span");
    span.style.position = "absolute";
    span.style.visibility = "hidden";
    span.style.whiteSpace = "pre";
    span.style.fontFamily = cs.fontFamily;
    span.style.fontSize = cs.fontSize;
    span.style.fontWeight = cs.fontWeight;
    span.style.textTransform = cs.textTransform;
    span.style.letterSpacing = cs.letterSpacing;
    span.textContent = text;
    document.body.appendChild(span);
    const w = span.getBoundingClientRect().width;
    span.remove();
    return w;
  }

  function setText(str) {
    const has = !!(str && str.length);
    textEl.textContent = has ? str : "\u00A0";
    textEl.classList.toggle("hidden", !has);
    barEl.style.width = (has ? Math.min(measureTextWidth(str), mainEl.clientWidth) : 30) + "px";
  }

  function setMode(mode) {
    bodyEl.classList.remove("listening", "thinking");
    if (mode === "listening") bodyEl.classList.add("listening");
    if (mode === "thinking") bodyEl.classList.add("thinking");
  }

  function setHint(txt) { hintEl.textContent = txt; }

  function showStatus(txt) {
    statusEl.classList.remove("hide");
    statusLabelEl.textContent = txt;
    statusEl.classList.add("show");
  }
  function hideStatus() {
    if (!statusEl.classList.contains("show")) return;
    statusEl.classList.add("hide");
    setTimeout(() => {
      statusEl.classList.remove("show", "hide");
    }, 500);
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

  function playWordAnim(cls) {
    textEl.classList.remove("word-in", "word-out");
    void textEl.offsetWidth;
    textEl.classList.add(cls);
  }

  // révèle le texte mot par mot avec fondu entrée/sortie
  async function speakWords(fullText) {
    const words = fullText.trim().split(/\s+/);
    let current = "";
    for (let i = 0; i < words.length; i++) {
      current += (current ? " " : "") + words[i];
      textEl.textContent = current;
      textEl.classList.remove("hidden");
      barEl.style.width = Math.min(measureTextWidth(current), mainEl.clientWidth) + "px";
      playWordAnim("word-in");
      await sleep(WORD_DELAY_MS);
      if (i < words.length - 1) {
        playWordAnim("word-out");
        await sleep(FADE_MS);
      }
    }
  }

  async function boot() {
    const name = "SAMARITAN";
    textEl.classList.remove("hidden");
    for (let i = 1; i <= name.length; i++) {
      textEl.textContent = name.slice(0, i);
      barEl.style.width = Math.min(measureTextWidth(name.slice(0, i)), mainEl.clientWidth) + "px";
      await sleep(70);
    }
    await sleep(300);
  }

  // ---------- SPEECH TO TEXT ----------
  function initRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showStatus("Reconnaissance vocale non supportée");
      return null;
    }
    const rec = new SpeechRecognition();
    rec.lang = LANG;
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      isBusy = true;
      setMode("listening");
      setHint("écoute…");
      setText("");
    };

    rec.onresult = (event) => {
      setText(event.results[0][0].transcript.trim());
    };

    rec.onerror = () => {
      isBusy = false;
      setMode("");
      setHint("touche ou parle");
      setText("");
    };

    rec.onend = async () => {
      const transcript = textEl.textContent.trim();
      if (transcript) {
        await queryModel(transcript);
      } else {
        isBusy = false;
        setMode("");
        setHint("touche ou parle");
        setText("");
      }
    };

    return rec;
  }

  function startListening() {
    if (isBusy) return;
    if (!recognition) recognition = initRecognition();
    if (!recognition) return;
    try { recognition.start(); } catch (e) {}
  }

  // ---------- LOADER (BOOT) ----------
  const loaderEl         = document.getElementById("loader");
  const bootLogEl        = document.getElementById("boot-log");
  const loadingPaneEl    = document.getElementById("loading-pane-container");
  const loadingNameEl    = document.getElementById("loading-name");
  const loadingBarEl     = document.getElementById("loading-bar");
  const connectedEl      = document.getElementById("loading-connected");
  const connectedTextEl  = document.getElementById("loading-connected-text");

  const BOOT_LINES = [
    "x0.0/sirv",
    "+0.1/ecom",
    "[eth0]",
    "[eth1]",
    "feed_1 [ ]",
    "feed_2 [ ]",
    "feed_3 [ ]",
    "feed_4 [ ]",
    "feed_5 [ ]",
    "feed_6 [ ]",
    "feed_7 [ ]",
    "feed_8 [ ]",
    "feed_9 [ ]"
  ];
  const RESOURCES = [
    "resources.comm.archive",
    "resources.im.users",
    "resources.im.log",
    "resources.rin-im",
    "resources.email.users",
    "resources.email.data",
    "resources.voip",
    "resources.dsn-messaging",
    "resources.dsn-subscribers",
    "resources.web.users",
    "resources.web.content",
    "resources.video.feeds",
    "resources.video.archive",
    "linking.databases.sigint.xxx-",
    "linking.databases.sigint.xxx-100",
    "linking.databases.sigint.xxx-140",
    "linking.databases.sigint.xxx-154",
    "linking.databases.sigint.xxx-194",
    "linking.databases.sigint.xxx-207",
    "linking.databases.sigint.xxx-248",
    "linking.databases.sigint.xxx-274",
    "linking.databases.sigint.xxx-301",
    "linking.databases.sigint.xxx-342",
    "linking.databases.sigint.xxx-400",
    "linking.databases.sigint.xxx-449",
    "linking.databases.sigint.xxx-560",
    "linking.databases.sigint.xxx-631",
    "linking.databases.sigint.xxx-798",
    "linking.databases.sigint.xxx-830",
    "linking.databases.sigint.xxx-904",
    "linking.databases.sigint.xxx-999"
  ];

  let logLineCount = 0;

  function appendBootLine(line) {
    const idx = logLineCount++;
    const span = document.createElement("span");
    span.innerHTML = "<b style=\"color:#F00\">[[</b>"
      + (idx < 10 ? " x0" : "x") + idx
      + (idx < 10 ? " " : "")
      + "<b style=\"color:#F00\">]</b> " + line + "<br>";
    bootLogEl.appendChild(span);
  }

  function bootLoader() {
    loaderEl.classList.remove("open", "done", "error");
    bootLogEl.innerHTML = "";
    logLineCount = 0;
    loadingBarEl.style.width = "0%";
    loadingNameEl.textContent = "initialisation…";
    connectedEl.style.display = "none";
    connectedEl.classList.remove("show", "error");
    loadingPaneEl.style.opacity = "";
    loaderEl.style.display = "flex";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => loaderEl.classList.add("open"));
    });
  }

  function setLoaderProgress(pct) {
    loadingBarEl.style.width = Math.min(100, Math.max(0, pct)) + "%";
    const resIndex = Math.min(RESOURCES.length - 1, Math.floor(pct / 100 * RESOURCES.length));
    loadingNameEl.textContent = RESOURCES[resIndex];
    const target = Math.floor(pct / 100 * BOOT_LINES.length);
    while (logLineCount < target) appendBootLine(BOOT_LINES[logLineCount]);
  }

  async function finishLoader(ok) {
    loadingBarEl.style.width = "100%";
    loadingNameEl.textContent = RESOURCES[RESOURCES.length - 1];
    while (logLineCount < BOOT_LINES.length) appendBootLine(BOOT_LINES[logLineCount]);
    loadingPaneEl.style.opacity = "0";
    connectedEl.style.display = "block";
    connectedTextEl.textContent = ok ? "connection established" : "erreur de connexion";
    connectedEl.classList.toggle("error", !ok);
    connectedEl.classList.add("show");
    await sleep(2600);
    connectedEl.classList.remove("show");
    loaderEl.classList.add("done");
    await sleep(1200);
    loaderEl.style.display = "none";
    loaderEl.classList.remove("open", "done");
  }

  // ---------- CHARGEMENT DU MODÈLE ----------
  async function loadModel() {
    isBusy = true;
    setMode("thinking");
    setHint("chargement…");
    setText("");
    bootLoader();
    try {
      const progress_callback = (p) => {
        if (p.status === "progress") setLoaderProgress(p.progress);
      };
      const devices = [];
      if (navigator.gpu) devices.push("webgpu");
      devices.push("wasm");
      let lastErr = null;
      for (const device of devices) {
        try {
          generator = await pipeline("text-generation", MODEL_ID, {
            dtype: DTYPE,
            device,
            progress_callback
          });
          break;
        } catch (e) {
          lastErr = e;
        }
      }
      if (!generator) throw lastErr;
      await generator("Bonjour", { max_new_tokens: 1 });
      await finishLoader(true);
      setMode("");
      setHint("touche ou parle");
      setText("");
    } catch (err) {
      await finishLoader(false);
      setMode("");
      setHint("touche ou parle");
    } finally {
      isBusy = false;
    }
  }

  // ---------- LLM DANS LE NAVIGATEUR ----------
  async function queryModel(promptText) {
    setMode("thinking");
    setHint("réflexion…");
    setText("");
    showStatus("Réflexion");

    try {
      const messages = [
        { role: "system", content: "Tu es Samaritan, un assistant francophone. Réponds toujours en français, de façon concise et utile, en phrases courtes." },
        { role: "user", content: promptText }
      ];

      let streaming = false;
      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: (text) => {
          if (!streaming) {
            streaming = true;
            hideStatus();
          }
          setText(text.trim());
        }
      });

      await generator(messages, {
        max_new_tokens: MAX_NEW_TOKENS,
        do_sample: true,
        temperature: 0.7,
        top_p: 0.95,
        streamer
      });

      hideStatus();
      setMode("");
      const full = textEl.textContent.trim();
      if (full) {
        await speakWords(full);
      } else {
        showStatus("Aucune réponse");
        await sleep(2000);
        hideStatus();
      }
      setHint("touche ou parle");
    } catch (err) {
      hideStatus();
      setMode("");
      setHint("touche ou parle");
      showStatus("Erreur de génération");
      await sleep(3000);
      hideStatus();
    } finally {
      isBusy = false;
    }
  }

  // ---------- INTERACTION ----------
  document.addEventListener("touchstart", () => { if (!isBusy) startListening(); }, { passive: true });
  document.addEventListener("click", () => { if (!isBusy) startListening(); });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (!isBusy) startListening();
    }
  });

  document.getElementById("settings").addEventListener("click", (e) => {
    e.stopPropagation();
    panelEl.classList.toggle("open");
  });

  document.getElementById("reloadBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    panelEl.classList.remove("open");
    if (!isBusy) loadModel();
  });

  // ---------- INIT ----------
  setHint("touche ou parle");
  boot().then(() => loadModel());
})();
</script>
</body>
</html>
