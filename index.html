<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Samaritan</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://huggingface.co" crossorigin>
<link rel="dns-prefetch" href="https://huggingface.co">
<link rel="preconnect" href="https://cdn-lfs.huggingface.co" crossorigin>
<link rel="dns-prefetch" href="https://cdn-lfs.huggingface.co">
<style>
  @font-face {
    font-family: "magdacleanmono";
    src: url("magdacleanmono-regular-webfont.otf") format("opentype");
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    color: #000;
    background-color: #fff;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "magdacleanmono", "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  p {
    font-family: "magdacleanmono";
    font-size: clamp(1.1em, 6vw, 2em);
    text-transform: uppercase;
    display: block !important;
    margin: 0;
  }
  #text {
    font-weight: bold;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  #text.word-in {
    animation: textIn 0.15s ease;
  }
  #text.word-out {
    animation: textOut 0.15s ease forwards;
  }
  @keyframes textIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes textOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
  #main {
    display: block;
    width: 100%;
    max-width: 1200px;
    padding: 0 16px;
  }
  #main hr {
    width: 30px; /* default initial size */
    margin: 8px auto 0;
    border-top: 2px solid #000;
    border-bottom: none;
    transition: width 0.3s ease;
  }
  #main p, #main hr {
    margin-top: 0;
    margin-bottom: 0;
  }
  #main p.hidden {
    color: #fff;
  }
  #marker {
    margin-top: 20px;
  }
  #triangle {
    color: #F00;
    font-size: clamp(1.3em, 6vw, 2em);
    font-family: "magdacleanmono";
    display: inline-block;
  }
  body.listening #triangle { animation: pulse 1s ease-in-out infinite; }
  body.thinking #triangle  { animation: blink 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: 0.6; }
    50%  { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1);    opacity: 0.6; }
  }
  @keyframes blink {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  #settings {
    width: 40px;
    height: 40px;
    font-size: 14px;
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px));
    right: calc(env(safe-area-inset-right, 0px));
    color: #888;
    line-height: 40px;
    text-align: center;
    cursor: pointer;
    z-index: 20;
  }

  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent;
    z-index: 999;
    pointer-events: none;
    box-sizing: border-box;
  }
  #status.show { display: flex; }
  #status .label {
    background: #000;
    color: #fff;
    font-family: "magdacleanmono", "Courier New", monospace;
    font-size: clamp(1.2em, 6vw, 2.4em);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 20px 40px;
    max-width: min(82vw, 560px);
    border: 2px solid #000;
  }
  #status.show .label {
    animation: labelIn 0.5s ease;
  }
  #status.hide .label {
    animation: labelOut 0.5s ease forwards;
  }
  @keyframes labelIn {
    0%   { transform: scale(1.2);  opacity: 0; }
    45%  { transform: scale(0.55); opacity: 1; }
    100% { transform: scale(1);    opacity: 1; }
  }
  @keyframes labelOut {
    0%   { transform: scale(1);    opacity: 1; }
    45%  { transform: scale(0.55); opacity: 1; }
    100% { transform: scale(1.2);  opacity: 0; }
  }

  #panel {
    position: fixed;
    right: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 44px);
    display: none;
    z-index: 10;
    max-width: min(300px, calc(100vw - 20px));
    padding: 12px 14px;
    background: #fff;
    border: 1px solid #ddd;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.1);
    text-align: left;
  }
  #panel.open { display: block; animation: panelIn 0.3s ease; }
  #panel.closing { animation: panelOut 0.3s ease forwards; }
  #panel h1 {
    margin: 0 0 8px;
    color: #888;
    font-size: 0.65em;
    font-weight: normal;
    letter-spacing: 0.25em;
  }
  #panel p {
    margin: 0 0 8px;
    color: #000;
    font-size: 0.7em;
    word-break: break-all;
  }
  #panel button {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 6px 0;
    background: none;
    color: #000;
    border: 1px solid #888;
    font-family: inherit;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  #panel button:hover { background: #eee; }
  #logView {
    display: none;
    margin-top: 8px;
    max-height: 40vh;
    overflow: auto;
    background: #111;
    color: #0f0;
    font-family: "Courier New", monospace;
    font-size: 0.55em;
    line-height: 1.5;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #logView.show { display: block; }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes panelOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(8px); }
  }

  /* ---------- LOADER / BOOT ---------- */
  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #fafafa;
    z-index: 1000;
    overflow: hidden;
  }
  .loader-pane {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    background: #fff;
    z-index: 3;
    transition: width 1s cubic-bezier(0.77, 0, 0.18, 1);
  }
  #loader-left  { left: 0; border-right: 2px solid #000; }
  #loader-right { right: 0; border-left: 2px solid #000; }
  #loader.open  .loader-pane { width: 13%; }
  #loader.done  #loader-left  { transform: translateX(-100vw); }
  #loader.done  #loader-right { transform: translateX(100vw); }
  #loader.done  .loader-pane {
    border-color: transparent;
    transition: transform 1s cubic-bezier(0.77, 0, 0.18, 1), border-color 0.3s ease 0.5s;
  }

  /* Décorations tech sur les bords intérieurs des panneaux */
  #loader-left::after,
  #loader-right::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #000;
    z-index: 4;
    box-shadow:
      0 24vh 0 0 #000,
      0 48vh 0 0 #000,
      0 72vh 0 0 #000;
  }
  #loader-left::after  { top: 12vh; right: -10px; }
  #loader-right::after { top: 12vh; left: -10px; }
  .loader-pane .cnr {
    position: absolute;
    width: 18px;
    height: 18px;
    z-index: 4;
  }
  #loader-left .cnr.t  { top: 14px;    right: 12px;  border-top: 2px solid #000;    border-right: 2px solid #000; }
  #loader-left .cnr.b  { bottom: 14px; right: 12px;  border-bottom: 2px solid #000; border-right: 2px solid #000; }
  #loader-right .cnr.t { top: 14px;    left: 12px;   border-top: 2px solid #000;    border-left: 2px solid #000; }
  #loader-right .cnr.b { bottom: 14px; left: 12px;   border-bottom: 2px solid #000; border-left: 2px solid #000; }

  #loader-center {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #boot-log {
    position: absolute;
    top: max(12px, env(safe-area-inset-top, 0px));
    left: calc(13% + 12px);
    right: calc(50% + min(35vw, 230px) + 36px);
    width: auto;
    height: 72%;
    max-height: 72%;
    font-size: clamp(0.45em, 2.2vw, 0.6em);
    line-height: 1.7;
    color: #b0b0b0;
    text-align: left;
    overflow: hidden;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
  }
  @media (max-width: 820px) {
    #boot-log {
      left: calc(13% + 10px);
      right: calc(13% + 10px);
      top: 6px;
      height: 38%;
      max-height: 38%;
      font-size: clamp(0.32em, 1.8vw, 0.42em);
    }
  }
  #boot-log .boot-line {
    display: block;
    animation: logLineIn 0.2s ease;
  }
  #boot-log .boot-text { display: inline; }
  #boot-log .boot-cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    background: #000;
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: cursorBlink 1s steps(1) infinite;
  }
  @keyframes logLineIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes cursorBlink {
    50% { opacity: 0; }
  }
  #loader.open #boot-log {
    animation: logFadeIn 0.6s ease 0.2s forwards;
  }
  @keyframes logFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #loading-pane-container {
    text-align: center;
    opacity: 0;
  }
  #loader.open #loading-pane-container {
    animation: pulseIn 0.7s ease 0.35s forwards;
  }
  @keyframes pulseIn {
    0%   { opacity: 0; }
    30%  { opacity: 0.85; }
    45%  { opacity: 0.05; }
    100% { opacity: 1; }
  }
  #loader.finishing #loading-pane-container,
  #loader.finishing #boot-log {
    animation: paneFadeOut 0.8s ease forwards;
  }
  @keyframes paneFadeOut {
    to { opacity: 0; }
  }
  .invert {
    display: inline-block;
    background: #000;
    color: #fff;
    padding: 3px 8px;
    letter-spacing: 0.2em;
    font-size: clamp(0.5em, 2.5vw, 0.6em);
  }
  #loading-name {
    font-size: clamp(0.7em, 3.5vw, 1.1em);
    margin: 12px 0 10px;
    color: #000;
    min-height: 1.2em;
  }
  #loading-bar-container {
    width: min(70%, 460px);
    margin: 0 auto;
    border: 2px solid #000;
    padding: 2px;
    height: 18px;
    box-sizing: border-box;
  }
  #loading-bar {
    position: relative;
    background: #000;
    height: 100%;
    width: 0;
    overflow: hidden;
    transition: width 0.25s ease-out;
  }
  #loading-connected {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    transform: translateY(-50%);
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }
  #loading-connected.show { opacity: 1; }
  #loading-connected.hide { opacity: 0; }
  #loading-connected .label {
    display: inline-block;
    background: #000;
    color: #fff;
    font-family: "magdacleanmono", "Courier New", monospace;
    font-size: clamp(1.2em, 6vw, 2.4em);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 20px 40px;
    max-width: min(82vw, 560px);
    border: 2px solid #000;
  }
  #loading-connected.show .label { animation: labelIn 0.5s ease; }
  #loading-connected.hide .label { animation: labelOut 0.5s ease forwards; }
  #loading-connected.error .label { background: #F00; }
  .cursor-blink { animation: loaderBlink 1s steps(1) infinite; }
  @keyframes loaderBlink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div id="main">
    <p id="text" class="hidden">&nbsp;</p>
    <hr id="bar">
  </div>
  <div id="marker">
    <span id="triangle">&#9650;</span>
  </div>
  <div id="settings" title="Réglages">&#9881;</div>
  <div id="panel">
    <h1>Samaritan // Réglages</h1>
    <p id="modelName"></p>
    <button id="reloadBtn">Recharger le modèle</button>
    <button id="logBtn">Afficher le journal</button>
    <div id="logView"></div>
    <button id="copyLogBtn" style="display:none">Copier le journal</button>
  </div>
  <div id="status"><div class="label"></div></div>

  <div id="loader">
    <div id="loader-center">
      <div id="boot-log"></div>
      <div id="loading-pane-container">
        <div><span class="invert">loading <span class="cursor-blink">_</span></span></div>
        <div id="loading-name">initialisation…</div>
        <div id="loading-bar-container"><div id="loading-bar"></div></div>
      </div>
      <div id="loading-connected"><span id="loading-connected-text" class="label">connection established</span></div>
    </div>
    <div id="loader-left" class="loader-pane"><i class="cnr t"></i><i class="cnr b"></i></div>
    <div id="loader-right" class="loader-pane"><i class="cnr t"></i><i class="cnr b"></i></div>
  </div>

<script type="module">
import { env, pipeline, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1/dist/transformers.min.js";

(() => {
  "use strict";

  // ---------- CONFIG ----------
  // Version GitHub Pages : modèle servi depuis le CDN Hugging Face (huggingface.co)
  // et mis en cache dans le navigateur via la Cache API (persistant entre les visites).
  // Le dossier local models/ (ONNX ~460 Mo) dépasse la limite GitHub de 100 Mo/fichier
  // et ne peut donc pas être déployé : le premier chargement télécharge le modèle,
  // les suivants sont servis depuis le cache.
  env.allowLocalModels = false;
  env.useBrowserCache = true;
  env.useFSCache = false;
  env.useCustomCache = false;
  if (typeof SharedArrayBuffer !== "undefined" && env.backends && env.backends.onnx) {
    env.backends.onnx.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 1);
  }
  // Qwen2.5-0.5B par défaut partout (choix utilisateur). Sur iPhone 11 (4 Go RAM,
  // mono-thread), un reload Safari reste possible en fin de chargement (heap WASM
  // > 500 Mo) ; SmolLM2-135M (~90 Mo) sert de secours si le chargement échoue.
  const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (typeof navigator.maxTouchPoints === "number" && navigator.maxTouchPoints > 1);
  const MODEL_CHAIN = [
    "onnx-community/Qwen2.5-0.5B-Instruct-ONNX",
    "onnx-community/SmolLM2-135M-Instruct-ONNX"
  ];
  const DTYPE        = "q4f16";
  const LANG         = "fr-FR";
  const MAX_NEW_TOKENS   = 30;
  const MOBILE_MAX_NEW_TOKENS = 20;
  const WORD_DELAY_MS = 300;
  const FADE_MS       = 120;

  // ---------- JOURNAL ON-DEVICE (pas de console web sur mobile) ----------
  const devLog = [];
  function logDev(level, args) {
    try {
      const line = "[" + new Date().toISOString().slice(11, 19) + "] " + level + " " +
        Array.from(args).map(a => {
          if (a == null) return String(a);
          if (typeof a === "object") {
            const m = a.message != null ? a.message : (a.stack ? a.stack.split("\n")[0] : "");
            return m || JSON.stringify(a).slice(0, 200);
          }
          return String(a);
        }).join(" ");
      devLog.push(line);
      if (devLog.length > 300) devLog.shift();
    } catch (e) {}
  }
  ["log", "warn", "error"].forEach(m => {
    const orig = console[m].bind(console);
    console[m] = function() {
      try { logDev(m, arguments); } catch (e) {}
      orig.apply(null, arguments);
    };
  });
  window.addEventListener("error", (e) => { logDev("script", [e.message]); });
  window.addEventListener("unhandledrejection", (e) => { logDev("rejection", [e.reason]); });

  // ---------- DOM ----------
  const textEl      = document.getElementById("text");
  const barEl       = document.getElementById("bar");
  const bodyEl      = document.body;
  const panelEl     = document.getElementById("panel");
  const modelNameEl = document.getElementById("modelName");
  const mainEl      = document.getElementById("main");
  const statusEl    = document.getElementById("status");
  const statusLabelEl = document.querySelector("#status .label");

  let recognition = null;
  let isBusy = false;
  let generator = null;
  let statusHideTimer = null;
  let isLoading = false;
  let modelReady = false;
  let lastTranscript = "";
  let audioPrimed = false;
  let retryIndex = 0;
  const RETRY_DELAYS = [300, 1000, 2000, 3500];

  modelNameEl.textContent = MODEL_CHAIN[0];

  // ---------- AFFICHAGE ----------
  function measureTextWidth(text) {
    const cs = getComputedStyle(textEl);
    const span = document.createElement("span");
    span.style.position = "absolute";
    span.style.visibility = "hidden";
    span.style.whiteSpace = "pre";
    span.style.fontFamily = cs.fontFamily;
    span.style.fontSize = cs.fontSize;
    span.style.fontWeight = cs.fontWeight;
    span.style.textTransform = cs.textTransform;
    span.style.letterSpacing = cs.letterSpacing;
    span.textContent = text;
    document.body.appendChild(span);
    const w = span.getBoundingClientRect().width;
    span.remove();
    return w;
  }

  function setText(str) {
    const has = !!(str && str.length);
    textEl.textContent = has ? str : "\u00A0";
    textEl.classList.toggle("hidden", !has);
    barEl.style.width = (has ? Math.min(measureTextWidth(str), mainEl.clientWidth) : 30) + "px";
  }

  function setMode(mode) {
    bodyEl.classList.remove("listening", "thinking");
    if (mode === "listening") bodyEl.classList.add("listening");
    if (mode === "thinking") bodyEl.classList.add("thinking");
  }

  function showStatus(txt) {
    if (statusHideTimer) { clearTimeout(statusHideTimer); statusHideTimer = null; }
    statusEl.classList.remove("show", "hide");
    statusLabelEl.textContent = txt;
    void statusEl.offsetWidth;
    statusEl.classList.add("show");
  }
  function showThinkingStatus() {
    if (statusHideTimer) { clearTimeout(statusHideTimer); statusHideTimer = null; }
    statusEl.classList.remove("show", "hide");
    statusLabelEl.textContent = "calculating response";
    void statusEl.offsetWidth;
    statusEl.classList.add("show");
  }
  function hideStatus() {
    if (!statusEl.classList.contains("show")) return;
    statusEl.classList.add("hide");
    if (statusHideTimer) clearTimeout(statusHideTimer);
    statusHideTimer = setTimeout(() => {
      statusHideTimer = null;
      statusEl.classList.remove("show", "hide");
    }, 500);
  }

  function flashStatus(txt, ms) {
    showStatus(txt);
    if (statusHideTimer) clearTimeout(statusHideTimer);
    statusHideTimer = setTimeout(hideStatus, ms || 2500);
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

  function playWordAnim(cls) {
    textEl.classList.remove("word-in", "word-out");
    void textEl.offsetWidth;
    textEl.classList.add(cls);
  }

  // révèle le texte mot par mot : affiche le mot, fondu de sortie, effacement,
  // puis fondu d'entrée sur le mot suivant (un seul mot visible à la fois)
  async function speakWords(fullText) {
    const words = fullText.trim().split(/\s+/);
    for (let i = 0; i < words.length; i++) {
      textEl.classList.remove("hidden");
      textEl.textContent = words[i];
      barEl.style.width = Math.min(measureTextWidth(words[i]), mainEl.clientWidth) + "px";
      playWordAnim("word-in");
      await sleep(WORD_DELAY_MS);
      if (i < words.length - 1) {
        playWordAnim("word-out");
        await sleep(FADE_MS);
        textEl.textContent = "\u00A0";
      }
    }
  }

  async function boot() {
    const name = "SAMARITAN";
    textEl.classList.remove("hidden");
    for (let i = 1; i <= name.length; i++) {
      textEl.textContent = name.slice(0, i);
      barEl.style.width = Math.min(measureTextWidth(name.slice(0, i)), mainEl.clientWidth) + "px";
      await sleep(70);
    }
    await sleep(300);
  }

  // ---------- SPEECH TO TEXT ----------
  function initRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      showStatus("Reconnaissance vocale non supportée");
      return null;
    }
    const rec = new SpeechRecognition();
    rec.lang = LANG;
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    // iOS Safari peut rester "en écoute" indéfiniment sans finale résolu (ni onresult
    // ni onend). On impose : fin au silence (~1,6 s) ou timeout absolu (~8 s), et on
    // utilise les résultats intérimaires pour que la reconnaissance tourne jamais sans fin.
    const SILENCE_MS = 1600;
    const TOTAL_MS   = 8000;
    let silenceTimer = null;
    let totalTimer   = null;

    function stopRec() {
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      if (totalTimer)   { clearTimeout(totalTimer);   totalTimer = null; }
      try { rec.stop(); } catch (e) {}
    }

    rec.onstart = () => {
      isBusy = true;
      lastTranscript = "";
      setMode("listening");
      setText("");
      logDev("info", ["[stt] start"]);
      if (silenceTimer) clearTimeout(silenceTimer);
      if (totalTimer) clearTimeout(totalTimer);
      totalTimer = setTimeout(() => {
        logDev("warn", ["[stt] timeout total"]);
        stopRec();
      }, TOTAL_MS);
    };

    rec.onresult = (event) => {
      let text = "";
      try {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          if (res.isFinal) {
            lastTranscript = res[0].transcript.trim();
            logDev("info", ["[stt] final=" + lastTranscript]);
          } else {
            text += res[0].transcript;
          }
        }
      } catch (e) {
        logDev("warn", ["[stt] result absent", e]);
      }

      if (lastTranscript) {
        setText(lastTranscript);
        retryIndex = 0;
        logDev("info", ["[stt] fin au résultat final"]);
        stopRec();
      } else {
        text = text.trim();
        if (text) setText(text);
        if (silenceTimer) clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          logDev("info", ["[stt] fin par silence"]);
          stopRec();
        }, SILENCE_MS);
      }
    };

    rec.onerror = (e) => {
      logDev("warn", ["[stt] error=" + (e && e.error)]);
      stopRec();
      isBusy = false;
      lastTranscript = "";
      setMode("");
      setText("");
    };

    rec.onend = async () => {
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      if (totalTimer) { clearTimeout(totalTimer); totalTimer = null; }
      const transcript = lastTranscript || textEl.textContent.trim();
      lastTranscript = "";
      logDev("info", ["[stt] onend transcript='" + transcript + "'"]);
      if (transcript) {
        await queryModel(transcript);
      } else {
        setMode("");
        setText("");
        isBusy = false;
        if (retryIndex < RETRY_DELAYS.length) {
          const d = RETRY_DELAYS[retryIndex];
          retryIndex++;
          logDev("warn", ["[stt] rien entendu, retry dans " + d + " ms"]);
          setTimeout(() => { startListening(true); }, d);
        } else {
          retryIndex = 0;
          flashStatus("je n'ai rien entendu");
        }
      }
    };

    return rec;
  }

  async function primeAudio() {
    if (audioPrimed) return;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        audioPrimed = true;
        return;
      }
      await Promise.race([
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
          stream.getTracks().forEach(t => t.stop());
          audioPrimed = true;
          logDev("info", ["[stt] micro primé"]);
        }),
        sleep(1500)
      ]);
    } catch (e) {
      logDev("warn", ["[stt] prime micro refusée", e]);
    }
  }

  async function startListening(auto = false) {
    if (isLoading) {
      logDev("warn", ["[stt] bloqué: chargement en cours"]);
      flashStatus("modèle en cours de chargement");
      return;
    }
    if (isBusy) {
      logDev("warn", ["[stt] bloqué: occupation"]);
      return;
    }
    if (!modelReady || !generator) {
      logDev("warn", ["[stt] bloqué: modèle non prêt"]);
      flashStatus("modèle non chargé");
      return;
    }
    if (!auto) retryIndex = 0;
    if (!recognition) recognition = initRecognition();
    if (!recognition) return;
    await primeAudio();
    try { recognition.start(); } catch (e) { logDev("warn", ["[stt] start throw", e]); }
  }

  // ---------- LOADER (BOOT) ----------
  const loaderEl         = document.getElementById("loader");
  const bootLogEl        = document.getElementById("boot-log");
  const loadingPaneEl    = document.getElementById("loading-pane-container");
  const loadingNameEl    = document.getElementById("loading-name");
  const loadingBarEl     = document.getElementById("loading-bar");
  const connectedEl      = document.getElementById("loading-connected");
  const connectedTextEl  = document.getElementById("loading-connected-text");

  const SYS_TOKENS = [
    "x0.0/sirv",
    "+0.1/ecom",
    "[eth0]",
    "[eth1]",
    "feed_1 [ ]",
    "feed_2 [ ]",
    "feed_3 [ ]",
    "feed_4 [ ]",
    "feed_5 [ ]",
    "feed_6 [ ]",
    "feed_7 [ ]",
    "feed_8 [ ]",
    "feed_9 [ ]"
  ];
  const RESOURCE_SEGMENTS = [
    "resources.comm.archive",
    "resources.im.users",
    "resources.im.log",
    "resources.rin-im",
    "resources.email.users",
    "resources.email.data",
    "resources.voip",
    "resources.dsn-messaging",
    "resources.dsn-subscribers",
    "resources.web.users",
    "resources.web.content",
    "resources.video.feeds",
    "resources.video.archive",
    "resources.video.streams",
    "resources.audio.calls",
    "resources.audio.voicemail",
    "resources.files.shares",
    "resources.files.sync",
    "resources.ftp.mirrors",
    "resources.irc.logs",
    "resources.irc.servers",
    "resources.net.dns",
    "resources.net.http",
    "resources.net.tor",
    "resources.grid.compute",
    "resources.grid.storage",
    "resources.telecom.fiber",
    "resources.telecom.sat",
    "resources.telecom.gsm",
    "linking.databases.sigint",
    "linking.databases.sigint.xxx-",
    "linking.databases.crime",
    "linking.databases.finance",
    "nodes.satellite.up-link",
    "nodes.satellite.down-link",
    "nodes.relay.a-01",
    "nodes.relay.b-07",
    "nodes.relay.c-11",
    "feeds.monitor.heartbeat",
    "feeds.monitor.alerts",
    "feeds.monitor.geo",
    "security.keys",
    "security.access.log",
    "security.cameras",
    "security.intel"
  ];

  function randomResourceName() {
    const seg = RESOURCE_SEGMENTS[Math.floor(Math.random() * RESOURCE_SEGMENTS.length)];
    const r = Math.random();
    if (r < 0.3) return seg + ".xxx-" + Math.floor(Math.random() * 1000);
    if (r < 0.55) return seg + "." + Math.floor(100 + Math.random() * 900);
    if (r < 0.7) return seg + "-" + String(Math.floor(Math.random() * 100)).padStart(2, "0");
    return seg;
  }

  function randomBootLine() {
    if (Math.random() < 0.3) {
      return SYS_TOKENS[Math.floor(Math.random() * SYS_TOKENS.length)];
    }
    return randomResourceName();
  }

  let logLineCount = 0;
  const STREAM_MAX_LINES = 60;
  const TYPE_INTERVAL = 16;
  let typeTimer = null;
  let pendingText = "";
  let activeLine = null;

  function bootLinePrefix(idx) {
    return "<b style=\"color:#F00\">[[</b>"
      + (idx < 10 ? " x0" : "x") + idx
      + (idx < 10 ? " " : "")
      + "<b style=\"color:#F00\">]</b> ";
  }

  function appendBootLine(line) {
    const span = document.createElement("span");
    span.className = "boot-line";
    span.innerHTML = bootLinePrefix(logLineCount++)
      + "<span class=\"boot-text\">" + line + "</span>";
    bootLogEl.appendChild(span);
    pruneBootLog();
    bootLogEl.scrollTop = bootLogEl.scrollHeight;
  }

  function startBootLine() {
    activeLine = document.createElement("span");
    activeLine.className = "boot-line";
    activeLine.innerHTML = bootLinePrefix(logLineCount++)
      + "<span class=\"boot-text\"></span>";
    const cursor = bootLogEl.querySelector(".boot-cursor");
    if (cursor) bootLogEl.insertBefore(activeLine, cursor);
    else bootLogEl.appendChild(activeLine);
    pendingText = randomBootLine();
  }

  function typeNextChar() {
    if (!activeLine) startBootLine();
    if (pendingText) {
      const ch = pendingText.charAt(0);
      pendingText = pendingText.slice(1);
      const text = activeLine.querySelector(".boot-text");
      if (text) text.textContent += ch;
    } else {
      activeLine = null;
      startBootLine();
    }
    pruneBootLog();
    bootLogEl.scrollTop = bootLogEl.scrollHeight;
  }

  function pruneBootLog() {
    while (bootLogEl.querySelectorAll(".boot-line").length > STREAM_MAX_LINES) {
      const first = bootLogEl.querySelector(".boot-line");
      if (first) bootLogEl.removeChild(first);
    }
  }

  function startResourceStream() {
    stopResourceStream();
    bootLogEl.innerHTML = "";
    logLineCount = 0;
    activeLine = null;
    pendingText = "";
    const cursor = document.createElement("span");
    cursor.className = "boot-cursor";
    bootLogEl.appendChild(cursor);
    typeTimer = setInterval(typeNextChar, TYPE_INTERVAL);
  }

  function stopResourceStream() {
    if (typeTimer) {
      clearInterval(typeTimer);
      typeTimer = null;
    }
  }

  let lastResPct = -1;

  function bootLoader() {
    cancelProgress();
    stopResourceStream();
    loaderEl.classList.remove("open", "done", "error", "finishing");
    bootLogEl.innerHTML = "";
    logLineCount = 0;
    lastResPct = -1;
    loadingBarEl.style.width = "0%";
    loadingNameEl.textContent = "initialisation…";
    connectedEl.style.display = "none";
    connectedEl.classList.remove("show", "hide", "error");
    loadingPaneEl.style.opacity = "";
    loaderEl.style.display = "flex";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => loaderEl.classList.add("open"));
    });
    startResourceStream();
  }

  function setLoaderProgress(pct) {
    pct = Math.min(100, Math.max(0, pct));
    loadingBarEl.style.width = pct + "%";
    const bucket = Math.floor(pct / 4);
    if (bucket !== lastResPct) {
      lastResPct = bucket;
      loadingNameEl.textContent = randomResourceName();
    }
  }

  async function finishLoader(ok, err) {
    stopResourceStream();
    const cursor = bootLogEl.querySelector(".boot-cursor");
    if (cursor) cursor.remove();
    cancelProgress();
    for (let i = 0; i < 6; i++) appendBootLine(randomBootLine());
    loadingBarEl.style.width = "100%";
    loadingNameEl.textContent = randomResourceName();
    loaderEl.classList.add("finishing");
    connectedEl.style.display = "block";
    connectedTextEl.textContent = ok
      ? "connection established"
      : (err ? describeError(err).slice(0, 60) : "erreur de connexion");
    connectedEl.classList.toggle("error", !ok);
    connectedEl.classList.add("show");
    await sleep(2600);
    connectedEl.classList.remove("show");
    connectedEl.classList.add("hide");
    await sleep(500);
    connectedEl.classList.remove("hide");
    loaderEl.classList.add("done");
    await sleep(1200);
    loaderEl.style.display = "none";
    loaderEl.classList.remove("open", "done");
  }

  // ---------- CHARGEMENT DU MODÈLE ----------
  async function requestPersistentStorage() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        await navigator.storage.persist();
      }
    } catch (e) {}
  }

  // WebGPU est instable sur certaines machines Windows (échec d'allocation GPU Dawn
  // -> "Failed to allocate memory to map ErrorBuffer" / instance GPU invalidée).
  // WASM est fiable partout ; passer à true uniquement si le WebGPU de la machine est OK.
  const USE_WEBGPU = false;

  let progressFrame = null;
  function cancelProgress() {
    if (progressFrame) {
      cancelAnimationFrame(progressFrame);
      progressFrame = null;
    }
  }
  function handleProgress(p) {
    if (p.status !== "progress") return;
    if (progressFrame) return;
    progressFrame = requestAnimationFrame(() => {
      progressFrame = null;
      setLoaderProgress(p.progress);
    });
  }

  function describeError(e) {
    if (e == null) return String(e);
    if (typeof e === "object") {
      const msg = (e.name ? e.name + ": " : "") + (e.message != null ? e.message : "") + (e.cause ? " cause=" + describeError(e.cause) : "");
      return msg + (e.stack ? " | " + e.stack.split("\n").slice(0, 3).join(" | ") : "");
    }
    return String(e);
  }

  async function loadModel() {
    isBusy = true;
    isLoading = true;
    modelReady = false;
    setMode("thinking");
    setText("");
    bootLoader();
    await requestPersistentStorage();
    const devices = (USE_WEBGPU && navigator.gpu) ? ["webgpu", "wasm"] : ["wasm"];
    let lastErr = null;
    let loadedModel = null;
    try {
      logDev("info", ["[load] chain=" + MODEL_CHAIN.join(" / ")]);
      for (const modelId of MODEL_CHAIN) {
        for (const device of devices) {
          try {
            generator = await pipeline("text-generation", modelId, {
              dtype: DTYPE,
              device,
              progress_callback: handleProgress
            });
            loadedModel = modelId;
            break;
          } catch (e) {
            lastErr = e;
            console.warn("[load] échec de " + modelId + " sur " + device + " :", e);
          }
        }
        if (loadedModel) break;
      }
      if (!loadedModel) throw lastErr;
      modelReady = true;
      modelNameEl.textContent = loadedModel;
      logDev("info", ["[load] ok=" + loadedModel]);
      cancelProgress();
      setLoaderProgress(100);
      await finishLoader(true);
      setMode("");
      setText("");
    } catch (err) {
      modelReady = false;
      console.error("[load] tous les modèles ont échoué :", err, err && err.stack);
      logDev("error", ["[load] fail=" + describeError(err)]);
      cancelProgress();
      await finishLoader(false, err);
      setMode("");
    } finally {
      isBusy = false;
      isLoading = false;
    }
  }

  // ---------- LLM DANS LE NAVIGATEUR ----------
  async function queryModel(promptText) {
    setMode("thinking");
    setText("");
    logDev("info", ["[gen] demande='" + promptText + "'"]);

    if (!generator || !modelReady) {
      flashStatus("modèle indisponible");
      setMode("");
      isBusy = false;
      return;
    }

    showThinkingStatus();

    try {
      const messages = [
        { role: "system", content: "Tu es Samaritan, un assistant francophone. Réponds toujours intégralement en français, jamais en anglais. Sois concis et utile, en phrases courtes." },
        { role: "user", content: promptText }
      ];

      let output = "";
      const stream = (opts) => {
        const streamer = new TextStreamer(generator.tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: (text) => {
            output += text;
            setText(output.trim());
          }
        });
        return generator(messages, Object.assign({ streamer }, opts));
      };

      try {
        if (IS_MOBILE) {
          await stream({ max_new_tokens: MOBILE_MAX_NEW_TOKENS, do_sample: false });
        } else {
          await stream({
            max_new_tokens: MAX_NEW_TOKENS,
            do_sample: true,
            temperature: 0.5,
            top_p: 0.95
          });
        }
      } catch (e) {
        console.warn("[gen] échec, retry greedy :", e);
        logDev("warn", ["[gen] retry greedy=" + describeError(e)]);
        output = "";
        setText("");
        await stream({ max_new_tokens: MOBILE_MAX_NEW_TOKENS, do_sample: false });
      }

      hideStatus();
      setMode("");
      const full = output.trim();
      logDev("info", ["[gen] réponse='" + full + "'"]);
      if (full) {
        await speakWords(full);
      } else {
        showStatus("Aucune réponse");
        await sleep(2000);
        hideStatus();
      }
    } catch (err) {
      hideStatus();
      setMode("");
      console.error("[gen] échec de génération :", err, err && err.stack);
      logDev("error", ["[gen] fail=" + describeError(err)]);
      showStatus("Erreur: " + describeError(err).slice(0, 48));
      await sleep(4000);
      hideStatus();
    } finally {
      isBusy = false;
    }
  }

  // ---------- INTERACTION ----------
  document.addEventListener("touchstart", () => { if (!isBusy) startListening(); }, { passive: true });
  document.addEventListener("click", () => { if (!isBusy) startListening(); });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (!isBusy) startListening();
    }
  });

  let panelClosing = false;
  function closePanel() {
    if (!panelEl.classList.contains("open") || panelClosing) return;
    panelClosing = true;
    panelEl.classList.add("closing");
    setTimeout(() => {
      panelEl.classList.remove("open", "closing");
      panelClosing = false;
    }, 300);
  }
  function togglePanel() {
    if (panelEl.classList.contains("open")) {
      closePanel();
    } else {
      panelEl.classList.add("open");
    }
  }

  document.getElementById("settings").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePanel();
  });

  document.getElementById("reloadBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    closePanel();
    if (!isBusy) loadModel();
  });

  const logBtn = document.getElementById("logBtn");
  const logView = document.getElementById("logView");
  const copyLogBtn = document.getElementById("copyLogBtn");
  let logShown = false;
  logBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    logShown = !logShown;
    logView.classList.toggle("show", logShown);
    copyLogBtn.style.display = logShown ? "block" : "none";
    if (logShown) {
      logView.textContent = devLog.join("\n") || "aucune erreur enregistrée";
      logView.scrollTop = logView.scrollHeight;
    }
  });
  copyLogBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(logView.textContent || "");
      }
    } catch (err) {}
  });

  // ---------- INIT ----------
  boot().then(() => loadModel());
})();
</script>
